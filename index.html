<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula Office</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{height:100vh;background:linear-gradient(135deg,#0f2027,#2c5364,#6a11cb);display:flex;color:white}

.sidebar{width:90px;backdrop-filter:blur(20px);background:rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;padding:15px 0;gap:15px}
.icon{width:55px;height:55px;display:flex;align-items:center;justify-content:center;border-radius:18px;cursor:pointer;font-size:22px;transition:.25s}
.icon:hover{background:rgba(255,255,255,.2);transform:scale(1.05)}

.main{flex:1;display:flex;flex-direction:column;padding:20px;gap:15px}
.topbar{height:60px;backdrop-filter:blur(20px);background:rgba(255,255,255,.12);border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}

.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:15px}

.card{backdrop-filter:blur(20px);background:rgba(255,255,255,.12);border-radius:18px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.25s;border:1px solid rgba(255,255,255,.2)}
.card:hover{transform:translateY(-5px);background:rgba(255,255,255,.2)}
.card-title{font-size:16px;font-weight:600}
.card-desc{font-size:12px;opacity:.7;margin-top:5px}
.launch-btn{margin-top:15px;padding:6px 10px;border-radius:10px;background:white;color:black;font-size:12px;text-align:center}

.credits{position:fixed;bottom:10px;right:15px;font-size:12px;opacity:.6}
</style>
</head>
<body>

<div class="sidebar">
  <div class="icon" onclick="loadSet('home')">🏠</div>
  <div class="icon" onclick="loadSet('coding')">💻</div>
  <div class="icon" onclick="loadSet('research')">🔍</div>
  <div class="icon" onclick="loadSet('ai')">🤖</div>
</div>

<div class="main">
  <div class="topbar">
    <div>Nebula Workspace</div>
    <div id="mode">HOME</div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="credits">Powered by Google & Atom Software • Founder: Aagastya Verma</div>

<script>
const sets = {
  home: [
    {name:"Docs", url:"https://docs.google.com", desc:"Write documents"},
    {name:"Sheets", url:"https://sheets.google.com", desc:"Spreadsheets"},
    {name:"Gmail", url:"https://mail.google.com", desc:"Email"},
    {name:"Gemini", url:"https://gemini.google.com", desc:"AI Assistant"}
  ],
  coding: [
    {name:"VS Code", url:"https://vscode.dev", desc:"Web IDE"},
    {name:"Replit", url:"https://replit.com", desc:"Online coding"},
    {name:"GitHub", url:"https://github.com", desc:"Repositories"},
    {name:"StackOverflow", url:"https://stackoverflow.com", desc:"Debug help"}
  ],
  research: [
    {name:"Perplexity", url:"https://perplexity.ai", desc:"AI research"},
    {name:"Scholar", url:"https://scholar.google.com", desc:"Papers"},
    {name:"Wikipedia", url:"https://wikipedia.org", desc:"Knowledge"},
    {name:"Notion", url:"https://notion.so", desc:"Notes"}
  ],
  ai: [
    {name:"Gemini", url:"https://gemini.google.com", desc:"Google AI"},
    {name:"ChatGPT", url:"https://chat.openai.com", desc:"AI chat"},
    {name:"Poe", url:"https://poe.com", desc:"Multi AI"},
    {name:"HuggingFace", url:"https://huggingface.co/chat", desc:"Open models"}
  ]
};

function loadSet(name){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  document.getElementById('mode').innerText = name.toUpperCase();

  sets[name].forEach(app => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => window.open(app.url, '_blank');

    card.innerHTML = `
      <div>
        <div class="card-title">${app.name}</div>
        <div class="card-desc">${app.desc}</div>
      </div>
      <div class="launch-btn">Launch</div>
    `;

    grid.appendChild(card);
  });
}

loadSet('home');
</script>

</body>
</html>
